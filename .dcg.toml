# .dcg.toml — commit this to your repo

[general]
hook_timeout_ms = 200   # default; fine for local dev

[packs]
enabled = [
    # Always-on by default (listed here for clarity):
    "core.git",
    "core.filesystem",

    # Your stack — opt-in packs:
    "database.postgresql",   # Blocks DROP DATABASE, TRUNCATE, DELETE without WHERE (Neon prod)
    "database.sqlite",       # Blocks DROP TABLE, DELETE without WHERE on local SQLite
    "payment.stripe",        # Protects against destructive Stripe CLI/API operations like deleting webhook endpoints and customers, or rotating API keys without coordination.
    "system.disk",           # Protects against destructive disk operations like dd to devices, mkfs, partition table modifications, RAID management, btrfs/LVM/device-mapper operations, and network block devices
    "windows.filesystem"     # Protects against recursive/forced filesystem destruction on Windows: cmd del /s, rd /s, format <drive>:, and PowerShell Remove-Item -Recurse (with or without -Force; aliases included), Clear-Content, and Clear-RecycleBin`.
]

[policy]
default_mode = "deny"

[heredoc]
enabled = true   # Catches destructive SQL/shell inside TypeScript template literals
