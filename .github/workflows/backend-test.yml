name: Backend Test & Coverage

on:
  pull_request:
    paths:
      - 'backend/**'
  push:
    branches:
      - master
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for changedSince

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Tests (Changed Files Only)
        if: github.event_name == 'pull_request'
        # Run diff coverage but continue even if thresholds fail (implied by no thresholds set in jest.config)
        run: npm run test:diff

      - name: Run Full Tests
        if: github.event_name != 'pull_request'
        run: npm run test:coverage

      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            # Simple summary parsing if json summary exists, otherwise just link to artifact
            echo "See artifacts for detailed HTML report." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Archive Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
