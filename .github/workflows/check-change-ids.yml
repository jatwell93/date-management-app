name: Change ids

# Written by software-factory (init). Calls the factory's reusable workflow at a
# pinned ref; change the pin with `upgrade`, not by hand. Require the status
# `factory/change-ids` in the default branch's ruleset: the workflow posts it on
# the PR head, because a pull_request_target check run attaches to the base commit.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: change-ids-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  change-ids:
    uses: jatwell93/software-factory/.github/workflows/check-change-ids.yml@d54cd85288c0602124f171de26fe65b8f6306142
    with:
      factory_ref: d54cd85288c0602124f171de26fe65b8f6306142
