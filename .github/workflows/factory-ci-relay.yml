name: Factory CI relay

# Written by software-factory (init). Calls the factory's reusable workflow at a
# pinned ref; change the pin with `upgrade`, not by hand.
#
# The trigger lists the project's CI workflows, copied from `ci_workflows` in
# factory.config.yml: a workflow_run trigger cannot read config, so `doctor`
# fails when the two lists differ. Rerun `init` after changing `ci_workflows`.

on:
  workflow_run:
    workflows:
      - 'CodeQL Advanced'
      - 'Database Conformance'
      - 'Deploy Frontend to Cloudflare Pages'
      - 'Deploy Workers API'
      - 'Frontend Test & Coverage'
      - 'Migrations E2E (real PostgreSQL)'
      - 'Secrets Scan'
      - 'Workers Bundle Size Check'
      - 'Workers Test'
    types: [completed]

permissions:
  actions: write
  pull-requests: read
  statuses: read

jobs:
  relay:
    uses: jatwell93/software-factory/.github/workflows/factory-ci-relay.yml@1b55a7946865384265a3fe07b8f53f400420f6e1
