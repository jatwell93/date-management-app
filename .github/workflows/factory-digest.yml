name: Factory digest

# Written by software-factory (init). Calls the factory's reusable workflow at a
# pinned ref; change the pin with `upgrade`, not by hand.

on:
  schedule:
    # Once a day, before the working day. Edit the hour for your time zone.
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: factory-digest
  cancel-in-progress: false

jobs:
  digest:
    uses: jatwell93/software-factory/.github/workflows/factory-digest.yml@7b9a691b7d817c4448c36d8ca7eda6cb0e2bbd37
    with:
      factory_ref: 7b9a691b7d817c4448c36d8ca7eda6cb0e2bbd37
