name: Factory digest

# One comment a day on the `Factory digest` issue (OpenSpec change
# add-spec-factory-runner, task 3.2): needs-human items, open factory PRs with
# their pr-feedback verdict, and factory runs that failed in the last day.
# scripts/factory-digest.js posts nothing when all three are empty.
#
# Runs main's code with the job token only: no Claude run, no checkout of PR
# code, no secret.

on:
  schedule:
    # 21:00 UTC is 07:00 or 08:00 in Melbourne, before the working day.
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the digest issue, its label and the comment
  pull-requests: read
  actions: read # gh run list for failed factory runs
  checks: read # gh pr checks (pr-feedback.js)
  statuses: read # commit statuses such as factory/no-go-guard

concurrency:
  group: factory-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Post the digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Post the digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/factory-digest.js
