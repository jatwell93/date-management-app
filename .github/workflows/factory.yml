name: Factory

# Runs OpenSpec changes unattended (OpenSpec change add-spec-factory-runner).
#
#   workflow_dispatch(change_id)          -> run-spec: one task, one PR
#   factory PR merged                      -> run-spec: the next task      (2.1)
#   review, review comment, or CI finished -> babysit-pr: one-shot pass   (2.2)
#     on a factory PR (CI runs arrive as a
#     dispatch with `pr`, from factory-ci-relay.yml)
#   owner removes needs-human from the     -> run-spec: the held task     (3.1)
#     change's tracking issue
#   any task route whose next task is      -> escalate job, no Claude run  (5.1)
#     marked (owner)
#   hourly schedule                        -> the one retry of a failed run (5.4):
#                                             babysit-pr if the change has an open
#                                             factory PR, else run-spec
#
# No Claude run starts while the tracking issue has needs-human or
# factory-retry. The report job labels a failed run's issue factory-retry
# (scripts/factory-retry.js); a failed retry escalates instead.
#
# The `route` job (scripts/factory-route.js) decides which, if any, and skips
# events with nothing to do (Actions checks still running, nothing actionable,
# PR parked with needs-human) before a Claude run starts. Only PRs authored by
# the Claude GitHub App AND labelled factory:<id> count.
#
# Why it cannot reach production:
#   * Its only secret is CLAUDE_CODE_OAUTH_TOKEN. No Doppler, Neon, Stripe or
#     Cloudflare credential is passed to it (scripts/factory-workflows.test.js
#     fails if one is added).
#   * It never merges. The main ruleset requires an approving review and the
#     Claude GitHub App, which authors factory PRs, cannot approve its own PR.
#     The deny-list below also blocks gh pr merge, gh pr review and gh api.
#   * Protected paths (scripts/check-no-go.js) are checked before every push and
#     again by the no-go-guard workflow, which runs main's copy of the check.
#   * The Claude GitHub App has no Workflows write permission, so a factory PR
#     cannot change this file, which review events on its PR run from.
#
# The action pushes as the Claude GitHub App, so CI runs on factory PRs (a push
# made with the default GITHUB_TOKEN would not trigger other workflows).

on:
  workflow_dispatch:
    inputs:
      change_id:
        description: OpenSpec change id (a folder under openspec/changes/) to start a task on
        required: false
        type: string
      pr:
        # Set by factory-ci-relay.yml when a CI run on a factory PR finishes.
        # The relay exists so that no workflow_run job here checks out PR code
        # with this workflow's write token.
        description: Factory PR number for a babysit pass
        required: false
        type: string
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  # The owner removing needs-human from a tracking issue resumes the change
  # (task 3.1). The router ignores the removal unless the owner made it.
  issues:
    types: [unlabeled]
  # The retry check (task 5.4): routes one failed run whose factory-retry label
  # is over an hour old. Route job only unless a retry is due.
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # the action's OIDC login to the Claude GitHub App
  actions: read # gh run view --log-failed
  checks: read # gh pr checks (pr-feedback.js)
  statuses: read # commit statuses such as factory/no-go-guard

jobs:
  route:
    name: Route the event
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      change_id: ${{ steps.route.outputs.change_id }}
      pr: ${{ steps.route.outputs.pr }}
      ref: ${{ steps.route.outputs.ref }}
      task: ${{ steps.route.outputs.task }}
      retry: ${{ steps.route.outputs.retry }}
    steps:
      # Always main, never the PR: review events default to the PR's merge ref,
      # and a factory PR must not be able to rewrite its own router.
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Decide what this event needs
        id: route
        # bash, not the default `bash -e`: adds pipefail, so a crash in the
        # router fails the step instead of being hidden by tee.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/factory-route.js | tee -a "$GITHUB_OUTPUT"

  run:
    name: Run one task or one babysit pass
    needs: route
    if: needs.route.outputs.mode == 'task' || needs.route.outputs.mode == 'babysit'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # New tasks queue per change and babysit passes per PR. A running job is
    # never cancelled; GitHub keeps only the newest queued one, which sees the
    # latest state anyway. run-spec exits if a factory PR is still open.
    concurrency:
      group: ${{ needs.route.outputs.mode == 'task' && format('factory-{0}', needs.route.outputs.change_id) || format('factory-babysit-{0}', needs.route.outputs.pr) }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The PR branch for a babysit pass; main for a new task.
          ref: ${{ needs.route.outputs.ref }}
          fetch-depth: 0

      # A babysit pass works on the PR branch, but follows main's skills and
      # checks: a factory PR that edited them (which no-go-guard blocks from
      # merging) must not steer its own review passes before the merge.
      # The restored files must never reach a commit: git checkout stages them,
      # so unstage them and hide them from `git add` (skip-worktree for tracked
      # files, .git/info/exclude for files only main has). Otherwise a pass on a
      # branch behind main would commit main's newer rules, and check-no-go
      # would park the PR for a protected-path edit it never made.
      - name: Use main's copy of the factory's own rules
        shell: bash
        run: |
          rules=(.claude AGENTS.md CLAUDE.md scripts/check-no-go.js scripts/babysit-round.js
                 scripts/pr-feedback.js scripts/factory-route.js scripts/factory-issue.js
                 scripts/factory-escalate.js scripts/factory-retry.js)
          git fetch --quiet origin main
          git checkout origin/main -- "${rules[@]}"
          git reset --quiet -- "${rules[@]}"
          git ls-files -z -- "${rules[@]}" | xargs -0 -r git update-index --skip-worktree
          git ls-files --others --exclude-standard -- "${rules[@]}" | sed 's#^#/#' >> .git/info/exclude
          git status --short

      - name: Check the change exists
        env:
          CHANGE_ID: ${{ needs.route.outputs.change_id }}
        run: test -f "openspec/changes/$CHANGE_ID/tasks.md" || { echo "::error::no tasks.md for $CHANGE_ID"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        # Below the job's 90: a step timeout fails the job, so the report job
        # records it for a retry. A job timeout can end the run `cancelled`.
        timeout-minutes: 80
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Review events come from these bots; the action refuses other bot actors.
          allowed_bots: 'sentry[bot],codescene-delta-analysis[bot],copilot-pull-request-reviewer[bot],claude[bot],github-actions[bot]'
          # change_id and pr come from the route job, which accepts only a plain
          # change id and a PR number.
          prompt: |
            ${{ needs.route.outputs.mode == 'task' && format('Use the run-spec skill (.claude/skills/run-spec/SKILL.md) on the OpenSpec change `{0}`.', needs.route.outputs.change_id) || format('Use the babysit-pr skill (.claude/skills/babysit-pr/SKILL.md) in one-shot mode on PR #{0}, a factory PR for the OpenSpec change `{1}`.', needs.route.outputs.pr, needs.route.outputs.change_id) }}
            You are running in GitHub Actions with no human watching. Follow the skill exactly; escalate instead of asking.
          claude_args: |
            --max-turns 200
            --allowedTools "Read,Edit,Write,Glob,Grep,Skill,TodoWrite,Bash(git:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(gh issue:*),Bash(gh label create:*),Bash(gh label list:*),Bash(gh run view:*),Bash(npm ci:*),Bash(npm run:*),Bash(npx openspec:*),Bash(npx prettier:*),Bash(node:*),Bash(cd:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh api:*),Bash(git push --force:*),Bash(git push -f:*),Bash(npm run test:prod:*),Bash(doppler:*),Bash(curl:*),Bash(wget:*)"

  escalate:
    name: Ask the owner to do an owner task
    needs: route
    if: needs.route.outputs.mode == 'escalate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Same group as the change's task runs, so it never races one.
    concurrency:
      group: ${{ format('factory-{0}', needs.route.outputs.change_id) }}
      cancel-in-progress: false
    steps:
      # main's copy, like the route job: no Claude run and no PR code here.
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Label the tracking issue and comment the task
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGE_ID: ${{ needs.route.outputs.change_id }}
          TASK: ${{ needs.route.outputs.task }}
        run: node scripts/factory-escalate.js "$CHANGE_ID" "$TASK"

  report:
    name: Record the run for a retry
    needs: [route, run]
    # A cancelled or skipped run records nothing.
    if: always() && (needs.run.result == 'failure' || needs.run.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # main's copy, like the route job: no Claude run and no PR code here.
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Label the tracking issue for a retry, or clear it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGE_ID: ${{ needs.route.outputs.change_id }}
          RESULT: ${{ needs.run.result }}
          # Set only when this run is the scheduled retry (the route's `retry`).
          RETRY: ${{ needs.route.outputs.retry }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$RESULT" = failure ]; then
            node scripts/factory-retry.js fail "$CHANGE_ID" "$RUN_URL"
          elif [ -n "$RETRY" ]; then
            # Only the retry itself ends factory-retrying; a parallel success
            # must not reset the one-retry budget.
            node scripts/factory-retry.js ok "$CHANGE_ID"
          fi
