name: Frontend Test & Coverage

on:
  pull_request:
    paths:
      - 'frontend/**'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for changedSince

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Token Compliance Check
        run: npm run token-compliance

      - name: Run Tests (Changed Files Only)
        if: github.event_name == 'pull_request'
        run: npm run test:diff || npm run test:coverage

      - name: Run Full Tests
        if: github.event_name != 'pull_request'
        run: npm run test:coverage

      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "## Frontend Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo "See artifacts for detailed HTML report." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Archive Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
