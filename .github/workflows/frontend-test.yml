name: Frontend Test & Coverage

# No `paths:` filter on purpose — see the explanation in backend-test.yml.
# Always trigger, detect changes in the `changes` job, gate the real jobs on it,
# so these checks always report and are safe to mark as required.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_AFTER"
          fi
          # Fail safe: unresolvable range means run the tests, never skip silently.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Base commit unresolvable; running frontend tests."
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "$head" | grep -q '^frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  # Correctness signal. No coverage thresholds — safe to require.
  test:
    name: Frontend Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Needed for changedSince

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Keep npm major in sync with the lockfile generator (see backend-test.yml).
      - name: Pin npm to match lockfile generator
        run: npm i -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Token Compliance Check
        run: npm run token-compliance

      - name: Run Tests (Changed Files Only)
        if: github.event_name == 'pull_request'
        run: npm run test:diff || npm test

      - name: Run Full Tests
        if: github.event_name != 'pull_request'
        run: npm test

  # Coverage thresholds run separately and are NOT required, mirroring the
  # backend split so correctness is never blocked on a coverage ratchet.
  coverage:
    name: Frontend Coverage
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm to match lockfile generator
        run: npm i -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run Coverage
        run: npm run test:coverage

      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "## Frontend Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo "See artifacts for detailed HTML report." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Archive Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
