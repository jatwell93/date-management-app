name: Frontend Test & Coverage

# No `paths:` filter on purpose — see the explanation in workers-test.yml.
# Always trigger, detect changes in the `changes` job, gate the real jobs on it,
# so these checks always report and are safe to mark as required.
on:
  pull_request:
  push:
    branches:
      # Kept in sync with workers-test.yml. `master` is listed defensively: the
      # ruleset targets ~DEFAULT_BRANCH, so if the default branch were ever
      # renamed, pushes to it must still run this workflow — otherwise the
      # required "Frontend CI Gate" check would never report for those pushes.
      - main
      - master

permissions:
  contents: read

# Cancel superseded runs on the same PR only. Default-branch pushes are never
# cancelled, so the required "Frontend CI Gate" always reports for each SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # Deliberately NOT `set -e` -- see the explanation in workers-test.yml.
          # Every failure path must fall back to RUNNING the tests, and the
          # `gate` job is the backstop if this job fails outright.
          set -u

          if [ -z "${GITHUB_OUTPUT:-}" ]; then
            echo "::error::GITHUB_OUTPUT is unset; cannot publish detection result."
            exit 1
          fi

          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_AFTER"
          fi

          run_tests() {
            echo "$1"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            run_tests "Base commit unavailable (force push or first commit); running frontend tests."
          fi

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            run_tests "Base commit ${base} not found; running frontend tests."
          fi

          # Capture explicitly: piping straight into grep would mask a git failure
          # as "no matches" (no pipefail), silently skipping the tests.
          if ! changed=$(git diff --name-only "$base" "$head" 2>&1); then
            run_tests "git diff failed (${changed}); running frontend tests."
          fi

          # shared/ is compiled into the frontend (see frontend/tsconfig.json include).
          # Editing this workflow must also run it, or a broken edit ships unexercised.
          if printf '%s\n' "$changed" | grep -qE '^(frontend|shared)/|^\.github/workflows/frontend-test\.yml$'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  # Correctness signal. No coverage thresholds — safe to require.
  test:
    name: Frontend Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Needed for changedSince

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Keep npm major in sync with the lockfile generator (see workers-test.yml).
      - name: Pin npm to match lockfile generator
        run: npm i -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Token Compliance Check
        run: npm run token-compliance

      # `vite build` only transpiles, so nothing else type-checks the frontend
      # (CRA's build did, until #290). tsconfig.json also includes
      # ../shared/**, hence the `shared/` path in the change filter above.
      - name: Type check
        run: npm run type-check

      - name: Run Tests (Changed Files Only)
        if: github.event_name == 'pull_request'
        run: npm run test:diff || npm test

      - name: Run Full Tests
        if: github.event_name != 'pull_request'
        run: npm test

  # ESLint over the files this PR changed (scripts/lint-diff.js). Full
  # `eslint .` takes over ten minutes, so CI lints the diff only, matching the
  # pre-commit gate in AGENTS.md. `eslint.ignores.js` excludes workers/, so a
  # workers-only PR lints nothing and passes quickly. Not path-filtered: the
  # script exits at once when no lintable file changed, which keeps the gate
  # safe to require. Runs on pull requests only.
  lint:
    name: Lint (changed files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LINT_DIFF_BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # lint-diff.js needs the merge base

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Pin npm to match lockfile generator
        run: npm i -g npm@11

      # --ignore-scripts: root `prepare` runs `npm run compile`, which ESLint
      # does not need.
      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Lint changed files
        run: npm run lint:diff

  # Coverage thresholds run separately and are NOT required, so correctness
  # is never blocked on a coverage ratchet.
  coverage:
    name: Frontend Coverage
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm to match lockfile generator
        run: npm i -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run Coverage
        run: npm run test:coverage

      - name: Generate Coverage Summary
        if: always()
        run: |
          echo "## Frontend Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo "See artifacts for detailed HTML report." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Archive Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

  # THE required status check -- see the explanation in workers-test.yml.
  # Require "Frontend CI Gate", not the individual jobs. `coverage` excluded.
  gate:
    name: Frontend CI Gate
    if: always()
    needs: [changes, test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate frontend job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          echo "changes=${CHANGES_RESULT} frontend_changed=${FRONTEND_CHANGED:-<unset>} test=${TEST_RESULT} lint=${LINT_RESULT}"

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Change detection did not succeed (${CHANGES_RESULT}). Failing the gate rather than letting a skipped test job pass as success."
            exit 1
          fi

          # Lint runs on every pull request regardless of which paths changed,
          # so a skipped lint job on a PR is a failure to report, not a pass.
          # On push events the job is skipped by design.
          if [ "$EVENT" = "pull_request" ] && [ "$LINT_RESULT" != "success" ]; then
            echo "::error::Lint (changed files) did not succeed (result: ${LINT_RESULT})."
            exit 1
          fi

          if [ "${FRONTEND_CHANGED:-}" != "true" ]; then
            echo "No frontend changes detected - gate passes with test job skipped."
            exit 0
          fi

          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::Frontend Tests did not succeed (result: ${TEST_RESULT})."
            exit 1
          fi
