name: Migration Prep (reusable)

# Phase 1 task 1.7 — reusable migration preparation workflow.
#
# Called by workers-deploy.yml BEFORE the Worker deploy. Runs the full
# migration validation + apply + verify sequence against the target Neon
# database via Doppler-injected secrets. Each step uploads its stdout as a
# CI artifact for audit. The runner enforces expand-only compatibility at
# load time (runner.ts:224), so "apply expand-compatible schema" is enforced
# by the runner itself — no separate guard is needed here.
#
# The sequence runs as ONE job with sequential steps so that:
#   - the protected production environment gate (15-min wait timer + branch
#     policy + required reviewers) is applied exactly once, not six times;
#   - Doppler CLI is installed once;
#   - checkout, dependency install, and TypeScript compile happen once on a
#     single checked-out revision.
#
# Steps run sequentially: status → preflight → pitr-check → apply → seed →
# verify. A failure in any step stops the sequence and blocks the downstream
# Worker deploy. Each step uploads its own artifact with `if: always()` so
# partial evidence is preserved even on mid-sequence failure.
#
# In "validate" mode (PR previews), only status + preflight run (read-only,
# no mutations on the shared dev database).
#
# Credential-level enforcement: the job declares
# `environment: ${{ inputs.environment }}` so production secrets
# (DOPPLER_TOKEN, NEON_API_KEY) are only available when called with
# environment=production. The production GitHub environment has branch
# policy + a 15-minute wait timer + can_admins_bypass=false, so a local
# `wrangler deploy --env production` without break-glass credentials cannot
# bypass these checks.
on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment (production | preview)'
        required: true
        type: string
      deployment_sha:
        description: 'Git SHA being deployed (recorded in the migration ledger)'
        required: true
        type: string
      mode:
        description: '"full" runs status→preflight→pitr→apply→seed→verify; "validate" runs status→preflight only (read-only, for PR previews)'
        required: false
        type: string
        default: 'full'
      neon_project_id:
        description: 'Neon project ID for PITR readiness check'
        required: false
        type: string
        default: 'dawn-darkness-22587117'
      neon_branch:
        description: 'Neon branch name to filter PITR restore points by (the Neon production branch, not the Git branch)'
        required: false
        type: string
        default: 'production'
      pitr_max_age_hours:
        description: 'Max acceptable age (hours) of the newest Neon restore point'
        required: false
        type: string
        default: '2'
    secrets:
      DOPPLER_TOKEN:
        description: 'Doppler CLI token for the target environment'
        required: true
      NEON_API_KEY:
        description: >-
          Neon API key for the PITR readiness check (full mode only). Must be
          DECLARED here and threaded from the caller: a reusable workflow only
          surfaces environment secrets into its `secrets` context for names
          declared under `on.workflow_call.secrets` (the production environment
          then supplies the value, overriding the caller-passed expression).
          Optional so validate-mode callers (which skip the PITR step) need not
          pass it.
        required: false

permissions:
  contents: read

jobs:
  migration-prep:
    name: Migration prep (${{ inputs.environment }}, ${{ inputs.mode }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      MIGRATION_DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
      MIGRATION_TARGET_KIND: primary
      MIGRATION_ENVIRONMENT: ${{ inputs.environment == 'production' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Pin npm to match lockfile generator
        run: npm i -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      # ── Step 1: status (read-only ledger check) ──────────────────────
      - name: Run migrate:status (read-only ledger check)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run -- npm run migrate:status > migration-status.txt 2>&1
          cat migration-status.txt

      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-status-${{ inputs.deployment_sha }}
          path: migration-status.txt
          retention-days: 30

      # ── Step 2: preflight (read-only readiness) ──────────────────────
      - name: Run migrate:preflight (read-only readiness)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run -- npm run migrate:preflight > migration-preflight.txt 2>&1
          cat migration-preflight.txt

      - name: Upload preflight artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-preflight-${{ inputs.deployment_sha }}
          path: migration-preflight.txt
          retention-days: 30

      # ── Steps 3–6: full mode only (production) ────────────────────────
      # In validate mode (PR previews), the workflow ends here — no
      # mutations touch the shared dev database.

      - name: Check Neon PITR readiness
        if: inputs.mode == 'full'
        env:
          # NEON_API_KEY is an environment secret scoped to the production
          # GitHub environment, but a reusable workflow only exposes it via the
          # `secrets` context when the name is declared under
          # `on.workflow_call.secrets` (see above) AND threaded by the caller
          # (workers-deploy.yml). The environment secret then supplies the value.
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ inputs.neon_project_id }}
          NEON_BRANCH: ${{ inputs.neon_branch }}
          PITR_MAX_AGE_HOURS: ${{ inputs.pitr_max_age_hours }}
        run: node scripts/check-neon-pitr.js > pitr-evidence.json 2> pitr-check.stderr

      - name: Upload PITR evidence
        if: always() && inputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: pitr-evidence-${{ inputs.deployment_sha }}
          path: |
            pitr-evidence.json
            pitr-check.stderr
          retention-days: 30

      - name: Run migrate:apply (expand-compatible schema)
        if: inputs.mode == 'full'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run -- npm run migrate:apply > migration-apply.txt 2>&1
          cat migration-apply.txt

      - name: Upload apply artifact
        if: always() && inputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: migration-apply-${{ inputs.deployment_sha }}
          path: migration-apply.txt
          retention-days: 30

      - name: Run migrate:seed (idempotent reference data)
        if: inputs.mode == 'full'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run -- npm run migrate:seed > migration-seed.txt 2>&1
          cat migration-seed.txt

      - name: Upload seed artifact
        if: always() && inputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: migration-seed-${{ inputs.deployment_sha }}
          path: migration-seed.txt
          retention-days: 30

      - name: Run migrate:verify (schema + reference data check)
        if: inputs.mode == 'full'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run -- npm run migrate:verify > migration-verify.txt 2>&1
          cat migration-verify.txt
          # verify exits 1 if not verified — propagate the failure
          grep -q "PASS" migration-verify.txt || { echo "::error::Migration verify did not PASS"; exit 1; }

      - name: Upload verify artifact
        if: always() && inputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: migration-verify-${{ inputs.deployment_sha }}
          path: migration-verify.txt
          retention-days: 30
