name: Deploy Frontend to Cloudflare Pages

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/pages-deploy.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/pages-deploy.yml'

permissions:
  contents: read

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://pr-${{ github.event.number }}.date-management-frontend.pages.dev
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0d7fd66d4292d901c684b723f66be69f

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Validate required Doppler secrets
        run: |
          doppler run -- bash -lc '
            required_vars=(
              REACT_APP_CLERK_PUBLISHABLE_KEY
              CLOUDFLARE_API_TOKEN
            )

            for var_name in "${required_vars[@]}"; do
              if [ -z "${!var_name:-}" ]; then
                echo "::error::Missing required Doppler secret: ${var_name}"
                exit 1
              fi
            done

            if [ -z "${REACT_APP_API_URL:-}" ] && [ -z "${REACT_APP_API_BASE_URL:-}" ]; then
              echo "::error::Missing required Doppler secret: set REACT_APP_API_URL or REACT_APP_API_BASE_URL"
              exit 1
            fi

            if [[ "${REACT_APP_CLERK_PUBLISHABLE_KEY}" != pk_test_* ]]; then
              echo "::error::Preview deployment requires a Clerk test publishable key (pk_test_*)."
              echo "::error::Use a preview Doppler config/token so pages.dev previews can render Clerk auth correctly."
              exit 1
            fi

            # Guardrail: ensure preview build does not point at production Worker
            api_url="${REACT_APP_API_URL:-${REACT_APP_API_BASE_URL:-}}"
            if [ -z "${api_url}" ]; then
              echo "::error::REACT_APP_API_URL / REACT_APP_API_BASE_URL is empty after Doppler resolution."
              echo "::error::Refusing to build a preview frontend with an empty API base URL."
              exit 1
            fi
            if [[ "${api_url}" == *"-prod."*".workers.dev"* ]] || [[ "${api_url}" == *"api.expirymate.com.au"* ]]; then
              echo "::error::Preview build is pointing at the PRODUCTION API (${api_url})."
              echo "::error::Doppler preview config should point REACT_APP_API_URL at the dev Worker (e.g. *-dev.workers.dev)."
              echo "::error::This usually means DOPPLER_TOKEN is bound to the wrong config. Verify the preview token targets the dev/preview Doppler config."
              exit 1
            fi

          '

      - name: Build frontend
        run: |
          doppler run -- bash -lc '
            export REACT_APP_API_URL="${REACT_APP_API_URL:-${REACT_APP_API_BASE_URL:-}}"
            export REACT_APP_API_BASE_URL="${REACT_APP_API_BASE_URL:-${REACT_APP_API_URL:-}}"

            if [ -z "${REACT_APP_API_URL}" ] || [ -z "${REACT_APP_API_BASE_URL}" ]; then
              echo "::error::Missing API endpoint secret: set REACT_APP_API_URL or REACT_APP_API_BASE_URL"
              exit 1
            fi

            npm run build
          '
        working-directory: ./frontend

      - name: Deploy preview to Cloudflare Pages
        run: |
          doppler run -- npx wrangler pages deploy frontend/build \
            --project-name date-management-frontend \
            --branch "pr-${{ github.event.number }}" \
            --commit-hash "${{ github.sha }}" \
            --commit-message "PR #${{ github.event.number }} - ${{ github.event.pull_request.title }}"

      - name: Publish preview URL summary
        run: |
          echo "## Frontend Preview Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview alias URL: https://pr-${{ github.event.number }}.date-management-frontend.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "Production URL remains: https://www.expirymate.com.au" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.expirymate.com.au
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0d7fd66d4292d901c684b723f66be69f

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Validate required Doppler secrets
        run: |
          doppler run -- bash -lc '
            required_vars=(
              REACT_APP_CLERK_PUBLISHABLE_KEY
              CLOUDFLARE_API_TOKEN
            )

            for var_name in "${required_vars[@]}"; do
              if [ -z "${!var_name:-}" ]; then
                echo "::error::Missing required Doppler secret: ${var_name}"
                exit 1
              fi
            done

            if [ -z "${REACT_APP_API_URL:-}" ] && [ -z "${REACT_APP_API_BASE_URL:-}" ]; then
              echo "::error::Missing required Doppler secret: set REACT_APP_API_URL or REACT_APP_API_BASE_URL"
              exit 1
            fi

            if [ -z "${REACT_APP_CLERK_PUBLISHABLE_KEY:-}" ]; then
              echo "::error::Missing required Doppler secret: REACT_APP_CLERK_PUBLISHABLE_KEY"
              exit 1
            fi

            if [[ "${REACT_APP_CLERK_PUBLISHABLE_KEY}" != pk_live_* ]]; then
              echo "::error::Production deployment requires a Clerk live publishable key (pk_live_*)"
              echo "::error::Deployment blocked to prevent serving Clerk test keys in production."
              exit 1
            fi

            # Guardrail: ensure production build does not point at dev/preview/tunnel hosts
            api_url="${REACT_APP_API_URL:-${REACT_APP_API_BASE_URL:-}}"
            if [ -z "${api_url}" ]; then
              echo "::error::REACT_APP_API_URL / REACT_APP_API_BASE_URL is empty after Doppler resolution."
              echo "::error::Refusing to build a production frontend with an empty API base URL."
              exit 1
            fi
            if [[ "${api_url}" == *"-dev."*".workers.dev"* ]] \
              || [[ "${api_url}" == *"localhost"* ]] \
              || [[ "${api_url}" == *"127.0.0.1"* ]] \
              || [[ "${api_url}" == *"ngrok"* ]] \
              || [[ "${api_url}" == *".trycloudflare.com"* ]] \
              || [[ "${api_url}" == *".loca.lt"* ]] \
              || [[ "${api_url}" == *".lhr.life"* ]] \
              || [[ "${api_url}" == *".pages.dev"* ]]; then
              echo "::error::Production build is pointing at a non-prod API (${api_url})."
              echo "::error::Doppler production config must point REACT_APP_API_URL at the prod Worker (e.g. https://api.expirymate.com.au)."
              echo "::error::This usually means DOPPLER_TOKEN is bound to the wrong config. Verify the production token targets the prd/production Doppler config."
              exit 1
            fi
          '

      - name: Build frontend
        run: |
          doppler run -- bash -lc '
            export REACT_APP_API_URL="${REACT_APP_API_URL:-${REACT_APP_API_BASE_URL:-}}"
            export REACT_APP_API_BASE_URL="${REACT_APP_API_BASE_URL:-${REACT_APP_API_URL:-}}"

            if [ -z "${REACT_APP_API_URL}" ] || [ -z "${REACT_APP_API_BASE_URL}" ]; then
              echo "::error::Missing API endpoint secret: set REACT_APP_API_URL or REACT_APP_API_BASE_URL"
              exit 1
            fi

            npm run build
          '
        working-directory: ./frontend

      - name: Deploy production to Cloudflare Pages
        run: |
          doppler run -- npx wrangler pages deploy frontend/build \
            --project-name date-management-frontend \
            --branch main \
            --commit-hash "${{ github.sha }}" \
            --commit-message "${{ github.event.head_commit.message }}"
