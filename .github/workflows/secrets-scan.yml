name: Secrets Scan

on:
  push:
  pull_request:
    branches: [main, master, develop]
permissions:
  contents: read
jobs:
  scan-secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch full history for scanning all commits

      - name: Install git-secrets
        run: |
          git clone https://github.com/awslabs/git-secrets.git /tmp/git-secrets
          cd /tmp/git-secrets
          sudo make install

      - name: Configure git-secrets
        run: |
          # Initialize git-secrets
          git secrets --install

          # Register AWS provider patterns
          git secrets --register-aws

          # Add custom patterns for high-confidence hardcoded secrets.
          # Require quoted values and high-entropy character sets to avoid
          # false positives on ordinary variables (e.g., token/password params in tests).
          git secrets --add 'password[[:space:]]*[:=][[:space:]]*["\047][A-Za-z0-9._+/=-]{20,}["\047]'
          git secrets --add 'api[_-]?key[[:space:]]*[:=][[:space:]]*["\047][A-Za-z0-9._+/=-]{20,}["\047]'
          git secrets --add '(access[_-]?token|refresh[_-]?token|api[_-]?token|bearer[_-]?token)[[:space:]]*[:=][[:space:]]*["\047][A-Za-z0-9._+/=-]{32,}["\047]'
          git secrets --add 'jwt[_-]?secret[[:space:]]*[:=][[:space:]]*["\047][A-Za-z0-9._+/=-]{24,}["\047]'
          git secrets --add 'database[_-]?url[[:space:]]*[:=][[:space:]]*["\047]?.*\:\/\/.*\:.*\@'
          git secrets --add 'AKIA[0-9A-Z]{16}'  # AWS Access Key ID
          git secrets --add 'sk-[a-zA-Z0-9]{32,}'  # OpenAI API Key
          git secrets --add 'ghp_[a-zA-Z0-9]{36,}'  # GitHub Personal Access Token
          git secrets --add 'gho_[a-zA-Z0-9]{36,}'  # GitHub OAuth Token
          git secrets --add 'github_pat_[a-zA-Z0-9_]{82}'  # GitHub Fine-grained PAT

          # Add pattern for PEM private keys (covers RSA, DSA, EC, OPENSSH, PKCS#8, etc.)
          # `--` ends option parsing so the pattern starting with `-----BEGIN` is treated as an argument, not a flag.
          # Anchor to a raw PEM header line to avoid matching this workflow/config text.
          git secrets --add -- '^-----BEGIN [A-Z0-9 ]+PRIVATE KEY-----$'
          # Allow known safe patterns (example .env files)
          git secrets --add --allowed '.env.example'
          git secrets --add --allowed 'your-secret-key-here'
          git secrets --add --allowed 'your_access_key_id'
          git secrets --add --allowed 'change-in-production'

      - name: Scan repository content
        run: |
          git secrets --scan

  npm-supply-chain:
    name: Check npm supply chain
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check npm dependency sources
        run: npm run security:npm-supply-chain
