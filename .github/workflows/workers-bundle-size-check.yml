name: Workers Bundle Size Check
on:
  pull_request:
    paths:
      - 'workers/**'
      - '.github/workflows/workers-bundle-size-check.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'workers/**'

permissions:
  contents: read

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./workers

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build worker bundle
        run: npm run build

      - name: Measure bundle size
        id: measure
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');

          const bundle = fs.readFileSync('dist/index.js');
          const gzip = zlib.gzipSync(bundle);

          const rawBytes = bundle.length;
          const gzipBytes = gzip.length;

          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `raw_bytes=${rawBytes}\n`);
          fs.appendFileSync(output, `raw_kib=${(rawBytes / 1024).toFixed(2)}\n`);
          fs.appendFileSync(output, `gzip_bytes=${gzipBytes}\n`);
          fs.appendFileSync(output, `gzip_kib=${(gzipBytes / 1024).toFixed(2)}\n`);
          NODE

      - name: Publish bundle summary
        run: |
          echo "## Workers Bundle Size" >> "$GITHUB_STEP_SUMMARY"
          echo "- Raw: ${{ steps.measure.outputs.raw_kib }} KiB (informational)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gzip: ${{ steps.measure.outputs.gzip_kib }} KiB" >> "$GITHUB_STEP_SUMMARY"
          echo "- Limit: 256.00 KiB (gzip)" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce bundle size limit
        env:
          GZIP_BYTES: ${{ steps.measure.outputs.gzip_bytes }}
        run: |
          # Cloudflare enforces its Worker size limit on the compressed bundle,
          # so we guard the gzip size rather than raw bytes. 256 KiB gives ample
          # headroom over the current ~152 KiB while staying well under
          # Cloudflare's 1 MiB (free) compressed limit.
          LIMIT_BYTES=262144
          if [ "$GZIP_BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "::error::Workers bundle is ${GZIP_BYTES} bytes gzipped (limit ${LIMIT_BYTES} bytes / 256 KiB)."
            exit 1
          fi
          echo "Bundle size check passed: ${GZIP_BYTES} bytes gzipped <= ${LIMIT_BYTES} bytes"
