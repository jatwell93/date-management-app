name: Deploy Workers API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'workers/**'
      - '.github/workflows/workers-deploy.yml'

permissions:
  contents: read

concurrency:
  group: workers-deploy-production
  cancel-in-progress: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.expirymate.com.au
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    defaults:
      run:
        working-directory: ./workers

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build worker
        run: npm run build

      - name: Validate required Doppler secrets
        run: |
          required_vars=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
          )

          for var_name in "${required_vars[@]}"; do
            if ! doppler run -- bash -lc "[ -n \"\${$var_name}\" ]"; then
              echo "::error::Missing required Doppler secret: ${var_name}"
              exit 1
            fi
          done

      - name: Deploy production worker
        run: doppler run -- npx wrangler deploy --env production
