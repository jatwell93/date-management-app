name: Deploy Workers API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'workers/**'
      - 'database/migrations/**'
      - 'src/database/migrations/**'
      - '.github/workflows/workers-deploy.yml'
      - '.github/workflows/migration-prep.yml'
  push:
    branches:
      - main
    paths:
      - 'workers/**'
      - 'database/migrations/**'
      - 'src/database/migrations/**'
      - '.github/workflows/workers-deploy.yml'
      - '.github/workflows/migration-prep.yml'

permissions:
  contents: read

# Concurrency: serialize all production deploys under one fixed group so a
# push or manual dispatch can never cancel or overlap an in-flight
# apply/seed/verify sequence. PR (preview) deploys keep ref-specific groups
# with cancel-in-progress so superseded preview runs are cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('workers-deploy-pr-{0}', github.ref) || 'workers-deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Phase 1 task 1.7 — migration preparation before Worker deploy.
  # Preview (PR) deploys run in validate mode (read-only status + preflight)
  # so migration files are checked without mutating the shared dev database.
  # Production deploys run in full mode (status → preflight → PITR → apply →
  # seed → verify) before the Worker is deployed.
  migration-prep-preview:
    name: Migration prep (preview, validate-only)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.event.pull_request.user.login != 'dependabot[bot]'
    needs: []
    uses: ./.github/workflows/migration-prep.yml
    with:
      environment: preview
      deployment_sha: ${{ github.event.pull_request.head.sha }}
      mode: validate
    secrets:
      DOPPLER_TOKEN: ${{ secrets.MIGRATION_DOPPLER_TOKEN }}

  migration-prep-production:
    name: Migration prep (production, full)
    # Production deploys run on push to main ONLY when the repository
    # variable PRODUCTION_AUTO_DEPLOY_ENABLED == 'true'. This is an
    # opt-in switch: the variable defaults to unset (disabled), so a
    # push to main does not trigger a production deploy until the
    # operator explicitly enables it. Manual `workflow_dispatch` from
    # main always works regardless of the variable — this is the
    # supported break-glass / rollback path and is never gated by the
    # variable. Set the variable in GitHub → Settings → Secrets and
    # variables → Actions → Variables.
    if: >
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       vars.PRODUCTION_AUTO_DEPLOY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    needs: []
    uses: ./.github/workflows/migration-prep.yml
    with:
      environment: production
      deployment_sha: ${{ github.sha }}
      mode: full
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      # Declared+threaded so the reusable workflow's production-environment job
      # surfaces the environment's NEON_API_KEY into its `secrets` context for
      # the PITR readiness check. The environment secret supplies the value.
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

  deploy-development:
    needs: [migration-prep-preview]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://date-management-api-dev.date-management-app.workers.dev
    defaults:
      run:
        working-directory: ./workers

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      # Keep npm major in sync with the lockfile generator (see backend-test.yml).
      - name: Pin npm to match lockfile generator
        run: npm i -g npm@11

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run lint

      - name: Type check (including tests)
        run: npm run typecheck

      - name: Build worker
        run: npm run build

      # Static assertion that this workflow binds NEON_CONNECTION_STRING
      # as a Worker secret (via wrangler secret put) BEFORE wrangler
      # deploy runs in deploy-production. Runs in <100ms, no deps.
      # See scripts/verify-workers-deploy-bindings.js for the rationale.
      - name: Validate workflow binding order
        working-directory: .
        run: node --test scripts/verify-workers-deploy-bindings.test.js

      # Task 1.10: wrangler.toml is what `wrangler deploy` pushes, so a `false`
      # observability master switch can silently disable Workers Logs no matter
      # what the dashboard shows. Fails before any deploy runs.
      - name: Validate observability configuration
        working-directory: .
        run: node --test scripts/verify-observability-config.test.js

      - name: Validate required Doppler secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          required_vars=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
          )

          for var_name in "${required_vars[@]}"; do
            if ! doppler run -- bash -lc "[ -n \"\${$var_name}\" ]"; then
              echo "::error::Missing required Doppler secret: ${var_name}"
              exit 1
            fi
          done

      # Same binding as production below. The development Worker is the
      # shadow-verification target named in task 3.8, and `stripe listen
      # --forward-to <dev worker>/api/webhooks/stripe` issues its own signing
      # secret — so this environment needs the binding to be exercisable at all.
      - name: Bind STRIPE_WEBHOOK_SECRET secret to worker (when configured)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run -- bash -lc '
            if [ -z "${STRIPE_WEBHOOK_SECRET:-}" ]; then
              echo "STRIPE_WEBHOOK_SECRET is not set in Doppler; leaving the Worker binding untouched."
              echo "POST /api/webhooks/stripe will answer 503 until task 3.8 registers an endpoint."
              exit 0
            fi
            if [[ "${STRIPE_WEBHOOK_SECRET}" != whsec_* ]]; then
              echo "::error::STRIPE_WEBHOOK_SECRET must be a Stripe signing secret (whsec_...)."
              echo "::error::A Stripe API key (sk_/rk_) or an endpoint id (we_) here fails every signature check."
              exit 1
            fi
            printf "%s" "${STRIPE_WEBHOOK_SECRET}" | npx wrangler secret put STRIPE_WEBHOOK_SECRET --env development
          '

      - name: Deploy development worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- npx wrangler deploy --env development --keep-vars

  deploy-production:
    # Deploy to production on push to main ONLY when the repository
    # variable PRODUCTION_AUTO_DEPLOY_ENABLED == 'true' (opt-in; defaults
    # to disabled), or on a manual workflow_dispatch from main (for
    # rollbacks / emergency patches — always available, never gated by
    # the variable). Pull requests trigger this workflow only for the
    # development preview deploy; the production environment's branch
    # protection rejects non-main refs, so guard the job explicitly
    # instead of letting it start and fail. Mirrors pages-deploy.yml.
    # See migration-prep-production above for the variable's rationale.
    needs: [migration-prep-production]
    if: >
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       vars.PRODUCTION_AUTO_DEPLOY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.expirymate.com.au
    defaults:
      run:
        working-directory: ./workers

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      # Keep npm major in sync with the lockfile generator (see backend-test.yml).
      - name: Pin npm to match lockfile generator
        run: npm i -g npm@11

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run lint

      # Also type-check test files (tsconfig.test.json) so a broken test import
      # cannot reach production via a direct push to main that skips the PR gate.
      - name: Type check (including tests)
        run: npm run typecheck

      - name: Build worker
        run: npm run build

      # Static assertion that this workflow binds NEON_CONNECTION_STRING
      # as a Worker secret (via wrangler secret put) BEFORE wrangler
      # deploy runs in deploy-production. Runs in <100ms, no deps.
      # This is the regression guard for the production cutover: a PR
      # that reorders or removes the binding step fails here before any
      # deploy runs. See scripts/verify-workers-deploy-bindings.js.
      - name: Validate workflow binding order
        working-directory: .
        run: node --test scripts/verify-workers-deploy-bindings.test.js

      # Task 1.10: wrangler.toml is what `wrangler deploy` pushes, so a `false`
      # observability master switch can silently disable Workers Logs no matter
      # what the dashboard shows. Fails before any deploy runs.
      - name: Validate observability configuration
        working-directory: .
        run: node --test scripts/verify-observability-config.test.js

      - name: Validate required Doppler secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          required_vars=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
          )

          for var_name in "${required_vars[@]}"; do
            if ! doppler run -- bash -lc "[ -n \"\${$var_name}\" ]"; then
              echo "::error::Missing required Doppler secret: ${var_name}"
              exit 1
            fi
          done

      - name: Guardrail - ensure prod Doppler config (block dev/preview values)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run -- bash -lc '
            # CLERK_SECRET_KEY must be a live key for production
            if [ -n "${CLERK_SECRET_KEY:-}" ] && [[ "${CLERK_SECRET_KEY}" != sk_live_* ]]; then
              echo "::error::Production Worker requires a Clerk live secret key (sk_live_*)."
              echo "::error::Doppler appears to be bound to a non-prod config. Verify DOPPLER_TOKEN targets the prd/production Doppler config."
              exit 1
            fi

            # FRONTEND_URL must be the canonical prod host.
            # Reject dev/preview/tunnel hosts and anything outside expirymate.com.au.
            PROD_HOST_RE="^https://([a-z0-9-]+\.)?expirymate\.com\.au(/.*)?$"
            value="${FRONTEND_URL:-}"
            if [ -z "${value}" ]; then
              echo "::error::Production Worker requires FRONTEND_URL to be set."
              exit 1
            fi
            if [[ "${value}" == *"-dev."*".workers.dev"* ]] \
              || [[ "${value}" == *"localhost"* ]] \
              || [[ "${value}" == *"127.0.0.1"* ]] \
              || [[ "${value}" == *".pages.dev"* ]] \
              || [[ "${value}" == *"ngrok"* ]] \
              || [[ "${value}" == *".trycloudflare.com"* ]] \
              || [[ "${value}" == *".loca.lt"* ]] \
              || [[ "${value}" == *".lhr.life"* ]]; then
              echo "::error::Production Worker FRONTEND_URL=${value} points at a dev/preview/tunnel host."
              echo "::error::Doppler likely bound to wrong config. Verify the production token."
              exit 1
            fi
            if ! [[ "${value}" =~ ${PROD_HOST_RE} ]]; then
              echo "::error::Production Worker FRONTEND_URL=${value} is not a canonical expirymate.com.au host."
              echo "::error::If this is intentional, update the allowlist in workers-deploy.yml."
              exit 1
            fi
          '

      - name: Validate Stripe test launch prices
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        working-directory: .
        run: doppler run -- node scripts/validate-stripe-deployment-config.js

      # Bind FRONTEND_URL to the worker as a secret BEFORE deploying. `wrangler
      # deploy` does not create this binding on its own (the value lives in
      # Doppler, deploy-time only), so a fresh worker could otherwise come up
      # with no FRONTEND_URL and silently break CORS + Clerk authorizedParties.
      # The guardrail step above has already validated the value is a canonical
      # expirymate.com.au host. printf (no trailing newline) keeps the origin exact.
      - name: Bind FRONTEND_URL secret to worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- bash -lc 'printf "%s" "$FRONTEND_URL" | npx wrangler secret put FRONTEND_URL --env production'

      # Bind NEON_CONNECTION_STRING to the worker as a secret BEFORE deploying.
      # `wrangler deploy` does NOT upload surrounding-shell env vars as Worker
      # secret bindings — it only registers what is in wrangler.toml
      # [env.*.vars] plus secrets previously registered via `wrangler secret
      # put`. NEON_CONNECTION_STRING is a secret (wrangler.toml:168,
      # workers/src/types/env.d.ts:35), not a [env.production.vars] entry, so
      # `doppler run -- npx wrangler deploy` alone would leave the Worker bound
      # to whatever NEON_CONNECTION_STRING was last `secret put`'d — potentially
      # the pre-cutover neondb_owner credential. This step re-binds the value
      # from Doppler on every production deploy, so a Doppler update (e.g. the
      # app_runtime cutover, or a rollback to the previous credential) takes
      # effect on the next deploy without any manual `wrangler secret put`.
      # printf (no trailing newline) keeps the connection string exact (no
      # trailing newline added to the secret value). The regression test
      # scripts/verify-workers-deploy-bindings.test.js asserts this step runs
      # before `Deploy production worker`.
      - name: Bind NEON_CONNECTION_STRING secret to worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- bash -lc 'printf "%s" "$NEON_CONNECTION_STRING" | npx wrangler secret put NEON_CONNECTION_STRING --env production'

      # Task 1.10: Sentry.withSentry initialises with `dsn: undefined` when
      # WORKERS_SENTRY_DSN is absent — capturing nothing and raising nothing, so
      # the Worker looks instrumented while reporting to no one. Unlike
      # NEON_CONNECTION_STRING and FRONTEND_URL above, the DSN is not re-bound on
      # every deploy, so nothing else would notice it going missing.
      #
      # Secret-binding half only: this job has Cloudflare auth (via doppler) and
      # runs in ./workers, hence the ../scripts path. The ingest half runs in the
      # canary, which holds the Sentry token.
      - name: Verify Worker observability secrets are bound
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          doppler run -- npx wrangler secret list --env production --format json \
            | node ../scripts/check-observability.js --no-ingest-check

      # Bind STRIPE_WEBHOOK_SECRET the same way FRONTEND_URL and
      # NEON_CONNECTION_STRING are bound above, and for the same reason:
      # `wrangler deploy` does NOT upload surrounding-shell env vars as Worker
      # secret bindings, so a value living only in Doppler never reaches the
      # Worker and `POST /api/webhooks/stripe` answers 503 forever.
      #
      # Unlike those two this secret is OPTIONAL, because the receiver ships
      # ahead of the Stripe endpoint registration (task 3.8) and is deliberately
      # inert until one exists. An unset value is therefore a normal state, not
      # a failure: the step leaves any existing binding alone and says so. That
      # is why it does not `printf ""` — writing an empty secret would look
      # identical to "configured" in `wrangler secret list` while still failing
      # every request.
      #
      # The `whsec_` check catches the one mistake that is otherwise silent: a
      # Stripe API key or an endpoint id (`we_...`) pasted in place of the
      # signing secret binds fine and then fails every signature verification,
      # which reads exactly like a misconfigured endpoint on Stripe's side.
      - name: Bind STRIPE_WEBHOOK_SECRET secret to worker (when configured)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run -- bash -lc '
            if [ -z "${STRIPE_WEBHOOK_SECRET:-}" ]; then
              echo "STRIPE_WEBHOOK_SECRET is not set in Doppler; leaving the Worker binding untouched."
              echo "POST /api/webhooks/stripe will answer 503 until task 3.8 registers an endpoint."
              exit 0
            fi
            if [[ "${STRIPE_WEBHOOK_SECRET}" != whsec_* ]]; then
              echo "::error::STRIPE_WEBHOOK_SECRET must be a Stripe signing secret (whsec_...)."
              echo "::error::A Stripe API key (sk_/rk_) or an endpoint id (we_) here fails every signature check."
              exit 1
            fi
            printf "%s" "${STRIPE_WEBHOOK_SECRET}" | npx wrangler secret put STRIPE_WEBHOOK_SECRET --env production
          '

      # Bind STRIPE_SECRET_KEY, for the billing endpoints added in task 3.1.p
      # (`create-checkout-session`, `cancel`, `create-portal-session`). Same
      # shape and same reason as the webhook secret above: `wrangler deploy`
      # does not upload surrounding-shell env vars, so a Doppler-only value
      # never reaches the Worker and all three answer 503.
      #
      # Optional for the same reason too -- the handlers are inert without it,
      # so an unset value leaves the binding alone rather than failing the
      # deploy.
      #
      # **The `rk_` preference is deliberate and is a real control, not style.**
      # These endpoints need write access to Customers, Checkout Sessions,
      # Billing Portal Sessions and Subscriptions and nothing else. A standard
      # `sk_` key also permits refunds, payouts and full charge history from an
      # internet-facing Worker with a far broader route surface than the webhook
      # receiver had. A restricted key is accepted silently; a standard key
      # warns loudly but does not fail, because refusing it would block a
      # deployment over a hardening preference.
      #
      # `whsec_` is rejected outright: pasting the signing secret here binds
      # fine and then fails every Stripe call with a 401 that reads like an
      # account problem.
      - name: Bind STRIPE_SECRET_KEY secret to worker (when configured)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run -- bash -lc '
            if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
              echo "STRIPE_SECRET_KEY is not set in Doppler; leaving the Worker binding untouched."
              echo "The billing endpoints (checkout/cancel/portal) will answer 503 until it is."
              exit 0
            fi
            if [[ "${STRIPE_SECRET_KEY}" == whsec_* ]]; then
              echo "::error::STRIPE_SECRET_KEY looks like a webhook signing secret (whsec_...)."
              echo "::error::That binds fine and then fails every Stripe API call with a 401."
              exit 1
            fi
            if [[ "${STRIPE_SECRET_KEY}" != rk_* && "${STRIPE_SECRET_KEY}" != sk_* ]]; then
              echo "::error::STRIPE_SECRET_KEY must be a Stripe API key (rk_... restricted, or sk_...)."
              exit 1
            fi
            if [[ "${STRIPE_SECRET_KEY}" == sk_* ]]; then
              echo "::warning::STRIPE_SECRET_KEY is a STANDARD key (sk_). A restricted key (rk_) is"
              echo "::warning::strongly preferred: scope it to write Customers, Checkout Sessions,"
              echo "::warning::Billing Portal Sessions and Subscriptions only. A standard key lets a"
              echo "::warning::compromised Worker issue refunds and read full charge history."
            fi
            # Mode is gated earlier by scripts/validate-stripe-deployment-config.js
            # ("Validate Stripe test launch prices"), which fails the deploy on a
            # live key. Restated as a warning here only because that step and this
            # one read the same variable and previously disagreed: this check
            # accepted rk_, that one required the literal sk_test_ prefix, so a
            # restricted key passed here and failed there.
            if [[ "${STRIPE_SECRET_KEY}" != *_test_* ]]; then
              echo "::warning::STRIPE_SECRET_KEY is not a test-mode key. Production is expected to"
              echo "::warning::stay in Stripe test mode until the launch gate moves."
            fi
            printf "%s" "${STRIPE_SECRET_KEY}" | npx wrangler secret put STRIPE_SECRET_KEY --env production
          '

      # The four checkout price IDs, from the same Doppler keys the backend
      # reads (`services/subscription-billing.helpers.ts` STRIPE_PRICE_CATALOG).
      #
      # Bound as secrets rather than written into `[env.production.vars]` for
      # two reasons: they differ between the Stripe test and live accounts, so
      # committing them would pin one; and Doppler is already their source of
      # truth for Express, so a second copy in wrangler.toml is a second thing
      # to keep in sync.
      #
      # They are not confidential -- the frontend sends the chosen price ID on
      # every checkout -- but they ARE a security control: the Worker refuses
      # any price outside this allowlist, which is what stops a caller checking
      # out against an arbitrary price in the account and being granted the tier
      # the resulting webhook reports.
      #
      # **Checkout returns 500 until at least one is bound**, deliberately: an
      # empty allowlist is a deployment fault, and answering 400 would blame the
      # customer for a valid upgrade request. The summary line below is the
      # signal an operator needs to see when that happens.
      - name: Bind Stripe checkout price IDs to worker (when configured)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler run -- bash -lc '
            # `set -euo pipefail` matters more here than in the sibling secret
            # steps. Those end with their single `wrangler` call, so its exit
            # status is the script status. This one loops: without -e a failed
            # binding is swallowed, the loop carries on, `bound` still
            # increments (it would be counting attempts, not successes), and the
            # step exits green having bound only some of the prices. The deploy
            # then runs with a partial allowlist -- Starter checkout works,
            # Professional answers 500 -- and the "nothing configured" warning
            # below is suppressed because bound > 0. `pipefail` is what makes
            # the `printf | wrangler` pipeline report wrangler failing rather
            # than printf succeeding.
            set -euo pipefail
            bound=0
            for key in STRIPE_STARTER_MONTHLY_PRICE_ID STRIPE_STARTER_ANNUAL_PRICE_ID \
                       STRIPE_PROFESSIONAL_MONTHLY_PRICE_ID STRIPE_PROFESSIONAL_ANNUAL_PRICE_ID; do
              value="${!key:-}"
              if [ -z "${value}" ]; then
                echo "${key} is not set in Doppler; leaving the Worker binding untouched."
                continue
              fi
              if [[ "${value}" != price_* ]]; then
                echo "::error::${key} must be a Stripe price ID (price_...), got a value starting ${value:0:5}"
                exit 1
              fi
              printf "%s" "${value}" | npx wrangler secret put "${key}" --env production
              # Only reached when the binding succeeded, because of -e above.
              bound=$((bound + 1))
            done
            if [ "${bound}" -eq 0 ]; then
              echo "::warning::No Stripe price IDs are configured. POST /api/subscription/create-checkout-session"
              echo "::warning::will answer 500 (billing not configured) for every request until at least one is set."
            fi
          '

      - name: Deploy production worker
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- npx wrangler deploy --env production

  # Phase 1 task 1.7 — post-deploy canary with delayed gate.
  # Runs authenticated smoke tests immediately after deploy, waits
  # CANARY_WAIT_MINUTES, then re-runs smoke tests and checks Sentry for new
  # issues. A failure in either round blocks the canary gate.
  #
  # Authentication: the canary mints a short-lived Clerk session token for a
  # dedicated smoke-test identity (configured in Doppler as SMOKE_USER_ID)
  # immediately before each smoke round, then revokes the session in a
  # finally block. The JWT is never stored in GitHub or carried across the
  # canary window. CLERK_SECRET_KEY and SMOKE_USER_ID are injected by
  # `doppler run` — the protected GitHub `production` environment holds only
  # DOPPLER_TOKEN. The /api/subscription/current endpoint requires
  # authentication (authenticateApiRequest → verifyToken), so an
  # unauthenticated canary would get 401 and fail spuriously.
  #
  # The Sentry check fails open (warns but does not block) if
  # SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT are unset.
  canary:
    name: Post-deploy canary
    needs: [deploy-production]
    runs-on: ubuntu-latest
    environment: production
    env:
      # Canary target. Defaults to the worker's *.workers.dev URL, which lives on
      # Cloudflare's own domain and so bypasses this zone's Bot Fight Mode — the
      # edge protection that 403s GitHub-runner datacenter IPs before they reach
      # the Worker (a false-negative that has nothing to do with deploy health).
      # This still exercises the real production Worker + DB + authenticated
      # endpoint. To canary the custom domain instead (requires a Cloudflare Pro
      # "Skip" rule matching the CANARY_WAF_* header from post-deploy-smoke.js),
      # set the repo/environment variable SMOKE_TARGET_URL to the custom domain
      # as a full absolute URL including scheme, e.g. https://api.expirymate.com.au
      # (post-deploy-smoke.js concatenates the path onto this base, so a bare
      # hostname without https:// makes fetch throw before any probe runs).
      SMOKE_TARGET_URL: ${{ vars.SMOKE_TARGET_URL || 'https://date-management-api-prod.date-management-app.workers.dev' }}
      CANARY_WAIT_MINUTES: ${{ vars.CANARY_WAIT_MINUTES || '15' }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Canary round 1 — authenticated smoke test
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set +e
          doppler run -- node scripts/run-authenticated-smoke.js > canary-round-1.json 2> canary-round-1.stderr
          SMOKE_EXIT=$?
          set -e
          cat canary-round-1.json
          cat canary-round-1.stderr >&2
          exit "$SMOKE_EXIT"

      - name: Canary wait window
        run: |
          echo "Waiting $CANARY_WAIT_MINUTES minutes before re-checking..."
          sleep "$((CANARY_WAIT_MINUTES * 60))"

      - name: Canary round 2 — authenticated smoke test after wait
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set +e
          doppler run -- node scripts/run-authenticated-smoke.js > canary-round-2.json 2> canary-round-2.stderr
          SMOKE_EXIT=$?
          set -e
          cat canary-round-2.json
          cat canary-round-2.stderr >&2
          exit "$SMOKE_EXIT"

      - name: Canary round 2 — Sentry new-issue check (fail open)
        if: ${{ env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != '' }}
        run: |
          # Check for new unresolved Sentry issues in the canary window.
          # Queries both fatal and critical severity levels using Sentry's
          # multiple-value search syntax (level:[fatal,critical] = OR).
          # `fatal` is Sentry's standard highest severity; `critical` is
          # included defensively in case of custom level configurations.
          # Fails the gate only if new fatal/critical issues are found.
          set -u
          SINCE="${CANARY_WAIT_MINUTES}m"
          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            "https://sentry.io/api/0/projects/${SENTRY_ORG}/${SENTRY_PROJECT}/issues/?query=is:unresolved+level:%5Bfatal,critical%5D+last_seen:-${SINCE}&statsSince=${SINCE}" || true)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Sentry issues HTTP $HTTP_CODE"
          echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Sentry API returned $HTTP_CODE; skipping fatal/critical-issue gate (fail open)."
            exit 0
          fi
          NEW_CRITICAL=$(echo "$BODY" | jq 'length' 2>/dev/null || echo "0")
          if [ "$NEW_CRITICAL" -gt 0 ]; then
            echo "::error::$NEW_CRITICAL new fatal/critical Sentry issue(s) detected during canary window. ROLLBACK."
            exit 1
          fi
          echo "No new fatal/critical Sentry issues in the canary window."

      # Task 1.10: the Sentry configuration is now REQUIRED on production. It was
      # previously a warn-and-continue, which meant a production canary could go
      # green having checked nothing at all — indistinguishable from a clean run.
      # The API call itself still fails open (a Sentry outage must not block a
      # deploy); it is the *absence of configuration* that is now fatal, because
      # that is a repo misconfiguration rather than a third-party problem.
      - name: Canary round 2 — Sentry configuration required
        if: ${{ env.SENTRY_AUTH_TOKEN == '' || env.SENTRY_ORG == '' || env.SENTRY_PROJECT == '' }}
        run: |
          echo "::error::SENTRY_AUTH_TOKEN, SENTRY_ORG and SENTRY_PROJECT are required for a production canary."
          echo "Without them the Sentry gate is skipped and the canary proves nothing about error rates."
          echo "SENTRY_AUTH_TOKEN: production environment secret. Needs event:read + project:read."
          echo "  NOT an Organization Auth Token — those carry org:ci (source maps/releases) and cannot"
          echo "  read project or event data. Use an Internal Integration token (Settings > Developer"
          echo "  Settings), which is org-owned rather than tied to a person, or a User Auth Token."
          echo "SENTRY_ORG / SENTRY_PROJECT: repository variables; SENTRY_PROJECT must name the project the"
          echo "Worker's WORKERS_SENTRY_DSN points at, not the legacy Express project."
          exit 1

      # Task 1.10: proves the Sentry pipeline is actually connected, rather than
      # trusting that an absent or misdirected DSN would have been noticed.
      # index-minimal.ts sets tracesSampleRate 1.0, so a correctly-wired Worker
      # produces a transaction per request — a project with zero received events
      # is a broken pipeline, not a quiet service.
      #
      # Ingest half only: this job runs at the repo root and has no Cloudflare
      # credentials. The secret-binding half runs in deploy-production, which has
      # both. Skipping BOTH halves is refused by the script.
      - name: Canary round 2 — Sentry ingest check
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/check-observability.js --no-secret-check \
            | tee observability-evidence.json

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-evidence-${{ github.sha }}
          path: |
            canary-round-1.json
            canary-round-1.stderr
            canary-round-2.json
            observability-evidence.json
            canary-round-2.stderr
          retention-days: 30
