config:
  target: 'https://date-management-api-dev.date-management-app.workers.dev'
  phases:
    # Warm-up phase
    - duration: 30
      arrivalRate: 5
      name: 'Warm-up'
    # Ramp-up phase
    - duration: 60
      arrivalRate: 10
      rampTo: 50
      name: 'Ramp-up'
    # Sustained load phase - 100 concurrent users
    - duration: 120
      arrivalRate: 100
      name: 'Sustained load'
    # Peak load phase - test p95 under stress
    - duration: 60
      arrivalRate: 150
      name: 'Peak load'
  processor: './artillery-processor.js'
  http:
    timeout: 10
  plugins:
    expect: {}
  ensure:
    maxErrorRate: 0.01 # Allow max 1% errors
    p95: 200 # p95 latency must be <200ms
    p99: 500 # p99 latency must be <500ms

# Authenticated scenarios send LOAD_TEST_BEARER_TOKEN, a Clerk session JWT;
# the run refuses to start without one (requireBearerToken, below).
# The Worker accepts only Clerk tokens; the old `/api/auth/login` step that
# minted a local token was removed in #560 (that token was rejected by every
# data route, so these scenarios only ever measured the 401 path). Clerk
# session tokens are short-lived, so a run longer than the token's lifetime
# measures 401s again for its tail. 401 stays an accepted status for that
# reason, and every one is counted as auth.rejected in the report: a run with
# a large auth.rejected count measured the rejection path, not the data path.
before:
  flow:
    - function: 'requireBearerToken'

scenarios:
  # Health check endpoint (no auth)
  - name: 'Health Check'
    weight: 30
    flow:
      - get:
          url: '/health'
          expect:
            - statusCode: 200
            - contentType: json
            - hasProperty: status

  # Health check with compression
  - name: 'Health Check (Gzip)'
    weight: 15
    flow:
      - get:
          url: '/health'
          headers:
            Accept-Encoding: 'gzip'
          expect:
            - statusCode: 200
            - hasHeader: 'content-encoding'

  # Get current user (requires auth)
  - name: 'Get Current User'
    weight: 25
    flow:
      - get:
          url: '/api/users/me'
          headers:
            Authorization: 'Bearer {{ $processEnvironment.LOAD_TEST_BEARER_TOKEN }}'
          afterResponse: 'countAuthRejections'
          expect:
            - statusCode: [200, 401]
            - contentType: json

  # Get products (requires auth)
  - name: 'Get Products'
    weight: 20
    flow:
      - get:
          url: '/api/products?limit=10&offset=0'
          headers:
            Authorization: 'Bearer {{ $processEnvironment.LOAD_TEST_BEARER_TOKEN }}'
          afterResponse: 'countAuthRejections'
          expect:
            - statusCode: [200, 401]
            - contentType: json

  # Get dashboard (complex query)
  - name: 'Get Dashboard'
    weight: 10
    flow:
      - get:
          url: '/api/dashboard'
          headers:
            Authorization: 'Bearer {{ $processEnvironment.LOAD_TEST_BEARER_TOKEN }}'
          afterResponse: 'countAuthRejections'
          expect:
            - statusCode: [200, 401]
            - contentType: json
