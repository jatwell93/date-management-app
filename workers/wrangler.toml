name = "date-management-api"
main = "dist/index.js"
compatibility_date = "2024-09-23"
no_bundle = true

# Node.js compatibility for Prisma and Node APIs
compatibility_flags = ["nodejs_compat"]

# Workers Routes Configuration
# Option 1: Custom Domain (Requires an active Cloudflare zone)
# [[routes]]
# pattern = "api.yourdomain.com/*"
# zone_name = "yourdomain.com"

# Option 2: Free workers.dev subdomain (Automatically assigned on publish)
workers_dev = true

# Route patterns (when using custom domain)
# [[routes]]
# pattern = "api.yourdomain.com/api/*"
# [[routes]]
# pattern = "api.yourdomain.com/health"

# Environment Variables (Non-Secret)
[env.production]
name = "date-management-api-prod"

[env.production.vars]
NODE_ENV = "production"
STORAGE_PROVIDER = "r2"
MAX_FILE_SIZE = "10485760"
CSV_BATCH_SIZE = "100"
RATE_LIMIT_WINDOW = "60000"
RATE_LIMIT_MAX_REQUESTS = "5"
RATE_LIMIT_MAX_AUTHENTICATED = "30"
MAX_CONCURRENT_CONNECTIONS = "50"
QUERY_MAX_RESULTS = "100"
QUERY_TIMEOUT_MS = "10000"

# R2 Bucket Bindings (Production)
[[env.production.r2_buckets]]
binding = "CSV_UPLOADS"
bucket_name = "csv-uploads-prod"

# Hyperdrive Configuration (Production)
[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "4fac081391784eb7bb2db2269c1fa870"

# KV namespace binding for distributed rate limiting
# Create via: npx wrangler kv namespace create RATE_LIMITER --env production
[[env.production.kv_namespaces]]
binding = "RATE_LIMITER"
id = "a0b277b9636144cba1bacdcb247a2d40"

# Analytics Engine Configuration (Production)
# IMPORTANT: Uncomment this section AFTER enabling Analytics Engine in Cloudflare Dashboard
# Steps:
# 1. Go to: https://dash.cloudflare.com/accounts/{ACCOUNT_ID}/workers/analytics-engine
# 2. Click "Enable Analytics Engine"
# 3. Uncomment the section below
# 4. Run: wrangler deploy --env production
#
[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "analytics_events"

# R2 Bucket Bindings (Development/Preview)
[[env.development.r2_buckets]]
binding = "CSV_UPLOADS"
bucket_name = "csv-uploads-dev"

# Hyperdrive Configuration (Development)
[[env.development.hyperdrive]]
binding = "HYPERDRIVE"
id = "4fac081391784eb7bb2db2269c1fa870"

# Development/Preview Environment
[env.development]
name = "date-management-api-dev"

[env.development.vars]
NODE_ENV = "development"
STORAGE_PROVIDER = "local"
RATE_LIMIT_WINDOW = "60000"
RATE_LIMIT_MAX_REQUESTS = "5"
RATE_LIMIT_MAX_AUTHENTICATED = "30"
MAX_CONCURRENT_CONNECTIONS = "50"
QUERY_MAX_RESULTS = "100"
QUERY_TIMEOUT_MS = "10000"

# KV namespace binding for distributed rate limiting in development/preview
# Create via: npx wrangler kv namespace create RATE_LIMITER --env development
[[env.development.kv_namespaces]]
binding = "RATE_LIMITER"
id = "bc5312ed84fa4ff1bf59d3dc067309be"

# Build Configuration
[build]
command = "npm run build"

# Analytics Engine Configuration
# Note: Analytics Engine must be enabled on your Cloudflare account before
# metrics can be written. If not enabled, metrics collection is gracefully skipped.
# 
# To enable:
# 1. Go to https://dash.cloudflare.com/accounts/{ACCOUNT_ID}/workers/analytics-engine
# 2. Click "Enable Analytics Engine"
# 3. Redeploy this worker with `wrangler deploy --env production`
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
# After enabling, metrics will be automatically written for all API requests.
# Data available in: Cloudflare Dashboard → Workers → Analytics

# Note: watch_dirs and upload sections are no longer needed
# wrangler handles file watching automatically

# Secrets (set via CLI: wrangler secret put <KEY> --env production)
# Production secrets required:
# - NEON_CONNECTION_STRING (Neon PostgreSQL connection string)
# - JWT_SECRET (JWT authentication secret)
# - CLERK_SECRET_KEY (Clerk backend secret for session token verification and organization bootstrap)
# - CLERK_WEBHOOK_SECRET (Clerk Svix webhook signing secret)
# - R2_ACCOUNT_ID (Cloudflare R2 account ID)
# - R2_ACCESS_KEY_ID (R2 API access key)
# - R2_SECRET_ACCESS_KEY (R2 API secret key)
# - R2_BUCKET_NAME (R2 bucket name, e.g., csv-uploads-prod)
# - SENTRY_DSN (optional, Sentry error monitoring)
#
# Example: wrangler secret put NEON_CONNECTION_STRING --env production
