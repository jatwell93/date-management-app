name = "date-management-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Node.js compatibility for Prisma and Node APIs
compatibility_flags = ["nodejs_compat"]

# Workers Routes Configuration
# Option 1: Custom Domain (Requires an active Cloudflare zone)
# [[routes]]
# pattern = "api.yourdomain.com/*"
# zone_name = "yourdomain.com"

# Option 2: Free workers.dev subdomain (Automatically assigned on publish)
workers_dev = true

# Route patterns (when using custom domain)
# [[routes]]
# pattern = "api.yourdomain.com/api/*"
# [[routes]]
# pattern = "api.yourdomain.com/health"

# Environment Variables (Non-Secret)
[env.production]
name = "date-management-api-prod"

[env.production.vars]
NODE_ENV = "production"
STORAGE_PROVIDER = "r2"
MAX_FILE_SIZE = "10485760"
CSV_BATCH_SIZE = "100"
RATE_LIMIT_WINDOW = "60000"
RATE_LIMIT_MAX_REQUESTS = "10"
RATE_LIMIT_MAX_AUTHENTICATED = "100"

# R2 Bucket Bindings (Production)
[[env.production.r2_buckets]]
binding = "CSV_UPLOADS"
bucket_name = "csv-uploads-prod"

# Hyperdrive Configuration (Production)
[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "4fac081391784eb7bb2db2269c1fa870"

# R2 Bucket Bindings (Development/Preview)
[[env.development.r2_buckets]]
binding = "CSV_UPLOADS"
bucket_name = "csv-uploads-dev"

# Hyperdrive Configuration (Development)
[[env.development.hyperdrive]]
binding = "HYPERDRIVE"
id = "4fac081391784eb7bb2db2269c1fa870"

# Development/Preview Environment
[env.development]
name = "date-management-api-dev"

[env.development.vars]
NODE_ENV = "development"
STORAGE_PROVIDER = "local"

# Build Configuration
[build]
command = "npm run build"
watch_dirs = ["src"]

# Secrets (set via CLI: wrangler secret put <KEY> --env production)
# Production secrets required:
# - NEON_CONNECTION_STRING (Neon PostgreSQL connection string)
# - JWT_SECRET (JWT authentication secret)
# - R2_ACCOUNT_ID (Cloudflare R2 account ID)
# - R2_ACCESS_KEY_ID (R2 API access key)
# - R2_SECRET_ACCESS_KEY (R2 API secret key)
# - R2_BUCKET_NAME (R2 bucket name, e.g., csv-uploads-prod)
# - SENTRY_DSN (optional, Sentry error monitoring)
#
# Example: wrangler secret put NEON_CONNECTION_STRING --env production
